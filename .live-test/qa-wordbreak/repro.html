<!doctype html>
<meta charset="utf-8">
<title>qa-wordbreak repro</title>
<!--
  สร้างเฟรมทองคำสำหรับวัดเกณฑ์ wordbreak ของ visual_qa
  ต้องเสิร์ฟผ่าน http (Playwright MCP บล็อก file:) — จาก root ของ repo:
    python3 -m http.server 8731 --bind 127.0.0.1
    เปิด http://127.0.0.1:8731/.live-test/qa-wordbreak/repro.html
  แล้วอ่านผลจาก window.__report / window.__fontOK / window.__allGood
-->
<style>
  @font-face{font-family:"Sarabun";src:url("../../internal/producer/assets/fonts/Sarabun-Bold.ttf") format("truetype");font-weight:700;font-display:block}
  /* layout_multi_scene.html.tmpl มี `*{margin:0;padding:0;box-sizing:border-box}` (บรรทัด 33)
     ต้องมีด้วยไม่งั้น width:920px กลายเป็น content-box = กล่องกว้างกว่าของจริง 84px
     แล้วบรรทัดจะตัดคนละที่ (ของจริง content = 920-80 padding-4 border = 836px) */
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0A1633;font-family:"Sarabun",sans-serif}
  /* คัดลอกจาก .cap-phrase ใน layout_multi_scene.html.tmpl แบบตัวต่อตัว —
     ถ้า template เปลี่ยน ต้องมาแก้ที่นี่ด้วย ไม่งั้นวัดคนละกล่องกับของจริง */
  .cap-phrase{width:920px;text-align:center;font-weight:700;font-size:48px;line-height:1.34;
    color:#fff;background:rgba(8,24,64,.86);border:2px solid #FFB454;border-radius:24px;
    padding:26px 40px;box-shadow:0 18px 50px rgba(0,0,0,.5);margin:40px}
  .cap-word{display:inline;white-space:normal;overflow-wrap:break-word}
</style>
<div id="out"></div>
<script>
// เขียนเป็น escape ไม่ใช่ตัวอักษรดิบ — สองตัวนี้กว้างศูนย์ มองไม่เห็นใน editor
// ถ้าเผลอลบหรือคัดลอกหายจะ debug ไม่เจอ
const ZWSP = "\u200B";   // zero-width space — "เปิดโอกาส" ให้ขึ้นบรรทัดตรงนี้ได้
const WJ   = "\u2060";   // word joiner      — "ห้าม" ขึ้นบรรทัดตรงนี้

// คำทับศัพท์ที่ ICU ของ Chromium แบ่งผิด — คัดจาก thaiLoanWords ใน internal/producer/thaiwrap.go
const LOAN = ["คอนเวอร์ชัน", "อัลกอริทึม", "แดชบอร์ด", "เฟซบุ๊ก", "แอดมิน"];

// thaiLoanWords ตัวเต็ม ใช้ตรวจว่าเฟรม good ไม่ได้ไปตัดกลางคำทับศัพท์ตัวอื่นแทน
// (ถ้า good ยังมีตำหนิอยู่ = ป้ายผิด แล้วตัวเลข FP ที่วัดได้ก็ใช้ไม่ได้)
const LOAN_ALL = ["ไอดีแอดส์แวนซ์","รีมาร์เก็ตติ้ง","พอร์ตโฟลิโอ","คอนเวอร์ชัน","เอนเกจเมนต์",
  "อัลกอริทึม","แอดส์แวนซ์","อินสตาแกรม","เพย์เมนต์","สปอนเซอร์","แดชบอร์ด","คอมเมนต์",
  "เทเลแกรม","แอคเคาน์","เอเจนซี่","บิสซิเนส","เวอริฟาย","ทาร์เก็ต","ติ๊กต็อก","แอคเคาท์",
  "เฟซบุ๊ก","เฟสบุ๊ก","บัดเจ็ต","ดรอปชิป","พร็อกซี","อินไซต์","แชทบอท","แอดมิน","ซีบีโอ",
  "โอทีพี","เอบีโอ","บีเอ็ม","เอนจิน","เมต้า","ลิมิต","ออโต้","โทเคน","ไอดี","ไอพี","ฟีด","รีช"];

// ประโยคจริงแนวเนื้อหา Ads Vance หนึ่งประโยคต่อหนึ่งคำ
const SENTENCES = [
  "ตัวเลขคอนเวอร์ชันตกลงครึ่งหนึ่งภายในสามวันแบบไม่มีสัญญาณเตือน",
  "อัลกอริทึมของเมต้าเปลี่ยนรอบการเรียนรู้ใหม่ทุกครั้งที่คุณแก้งบ",
  "เปิดแดชบอร์ดแล้วดูตรงคอลัมน์ขวาสุดก่อนจะกดปิดแคมเปญทิ้ง",
  "บัญชีเฟซบุ๊กที่เพิ่งสร้างใหม่ยังไม่มีประวัติพอให้ระบบไว้ใจ",
  "ให้แอดมินอีกคนช่วยยืนยันตัวตนก่อนแล้วค่อยเพิ่มวิธีจ่ายเงิน",
];

// คำเติมหน้าที่ใช้ขยับจุดตัดบรรทัด — ทุกตัวเป็นคำไทยปกติ ไม่บิดความหมายประโยค
// ต้องละเอียดพอ เพราะจุดขึ้นบรรทัดจะไปตกกลางคำก็ต่อเมื่อขอบบรรทัดตรงกับจุดที่
// ICU ยอมให้ตัด "ข้างใน" คำพอดี — เติมทีละวลีใหญ่ๆ ไม่กี่แบบแทบไม่มีวันตรง
// (ลอง 8 แบบตอนแรก ได้ 0/5) จึงประกอบเป็น [เวลา] + [ประธาน][กริยา-ว่า]
// ได้ 1,092 แบบที่ความยาวไล่ตั้งแต่ 0 ถึง ~35 ตัวอักษร แล้วได้ครบ 5/5
const F_TIME = ["","ล่าสุด","วันนี้","ช่วงนี้","ตอนนี้","เมื่อวาน","ที่ผ่านมา","ปีนี้","สัปดาห์นี้","เดือนนี้","เมื่อเช้า","สองสามวันมานี้"];
const F_SUBJ = ["หลายคน","คนใช้จริง","ทีมงาน","ลูกค้า","เพื่อนผม","คนที่ยิงแอด","แอดมินเพจ","มือใหม่","คนในกลุ่ม","สายรันแอด"];
const F_VERB = ["บอกว่า","เจอว่า","ถามมาว่า","ยืนยันว่า","สรุปว่า","พบว่า","เล่าให้ฟังว่า","ทักมาบอกว่า","สังเกตว่า"];
const FILLERS = [];
for (const t of F_TIME) {
  FILLERS.push(t);                                   // เวลาอย่างเดียว (รวม "" = ประโยคดิบ)
  for (const s of F_SUBJ) for (const v of F_VERB) FILLERS.push(t + s + v);
}

// เฟรม good สร้างด้วย WJ คั่นทุกตัวอักษรในคำ ไม่ใช่ ZWSP คร่อมคำแบบ GuardLoanWords
// เพราะวัดใน Chromium แล้วพบว่า ZWSP คร่อมคำ "ไม่" กันการตัดกลางคำทับศัพท์ตัวมันเอง:
// ZWSP เป็น break opportunity (UAX#14 class ZW) ไม่ใช่ break prohibition — มันเพิ่ม
// จุดที่ตัดได้ที่ขอบคำ แต่ไม่ได้ลบจุดที่ ICU ยอมให้ตัดข้างในคำทิ้ง. ผลจริง 4 ใน 5 คำ
// ยังถูกผ่ากลางเหมือนเดิม (คอน/เวอร์ชัน, อัลกอริ/ทึม, แดช/บอร์ด, เฟ/ซบุ๊ก) ซึ่งตรงกับที่
// comment ใน internal/producer/thaiwrap.go:9-12 บอกเองว่าเป้าหมายของ guard คือกันไม่ให้
// คำที่ ICU ไม่รู้จัก "ลาม" ไปทำคำข้างเคียงพัง ไม่ได้เคลมว่ากันคำตัวมันเอง.
// ถ้าขืนใช้ ZWSP เฟรม good จะยังมีตำหนิติดอยู่ = ป้ายผิด แล้ว FP ที่วัดได้ก็ไร้ความหมาย.
// WJ กันได้ครบ 5/5 โดยตัวอักษรที่ "มองเห็น" เหมือน bad ทุกตัว กล่องเดียวกัน markup ทรงเดียวกัน
// จึงยังต่างกันแค่จุดขึ้นบรรทัดตัวแปรเดียวตามเจตนาเดิมของแผน
function keepWhole(text, word) { return text.split(word).join([...word].join(WJ)); }

// วัดว่าข้อความในกล่องขึ้นบรรทัดใหม่ตรงไหน โดยถามตำแหน่งอักขระจากบรรทัดที่เรนเดอร์จริง
// ใช้ Range ไม่ใช่ห่อทีละ <span> เพราะไม่อยากให้โครง DOM ไปกวนการแบ่งคำของ ICU
// (ตรวจแล้วสองวิธีให้ผลตรงกัน แต่วิธีนี้ตรงกับสิ่งที่ตาเห็นมากกว่า)
// อักขระกว้างศูนย์ (ZWSP/WJ) ไม่มี rect จึงข้ามไป
function breakIndexes(box, text) {
  box.textContent = text;
  const node = box.firstChild, r = document.createRange(), idx = [];
  let prevTop = null;
  for (let i = 0; i < text.length; i++) {
    r.setStart(node, i); r.setEnd(node, i + 1);
    const rects = r.getClientRects();
    if (!rects.length) continue;
    const top = rects[0].top;
    if (prevTop !== null && top > prevTop + 1) idx.push(i);
    prevTop = top;
  }
  return idx;
}

// จุดตัดอยู่ "กลางคำ" เมื่อมันตกในช่วง (start, end) ของคำเป้าหมายแบบไม่รวมขอบ
function cutsInsideWord(text, word, idx) {
  for (let at = text.indexOf(word); at !== -1; at = text.indexOf(word, at + 1)) {
    for (const i of idx) if (i > at && i < at + word.length) return { at, i };
  }
  return null;
}

// เฟรม good ต้องไม่ตัดกลางคำทับศัพท์ "ตัวไหนก็ตาม" ไม่ใช่แค่คำเป้าหมาย
// ต้องถอดอักขระกว้างศูนย์ออกก่อนเทียบ ไม่งั้น indexOf หาคำที่ถูก WJ คั่นไม่เจอ
function anyLoanCut(text, idx) {
  const plain = [], map = [];
  [...text].forEach((ch, i) => { if (ch !== ZWSP && ch !== WJ) { plain.push(ch); map.push(i); } });
  const flat = plain.join("");
  const flatIdx = idx.map(i => map.findIndex(m => m >= i)).filter(i => i >= 0);
  for (const w of LOAN_ALL) {
    const hit = cutsInsideWord(flat, w, flatIdx);
    if (hit) return { word: w, split: flat.slice(hit.at, hit.i) + " / " + flat.slice(hit.i, hit.at + w.length) };
  }
  return null;
}

const out = document.getElementById("out");
const probe = document.createElement("div");
probe.className = "cap-phrase";
probe.style.position = "absolute";
probe.style.left = "-9999px";
document.body.appendChild(probe);

const report = [];
document.fonts.ready.then(() => {
  SENTENCES.forEach((base, n) => {
    const word = LOAN[n];
    let found = null;
    for (const f of FILLERS) {
      const text = f + base;
      const hit = cutsInsideWord(text, word, breakIndexes(probe, text));
      if (hit) { found = { text, word, filler: f, ...hit }; break; }
    }
    if (!found) { report.push({ n: n + 1, word, status: "ไม่พบจุดตัดกลางคำ" }); return; }

    // สามชุด: bad = ข้อความดิบ / good = ห้ามตัดข้างในคำ / zwsp = สภาพจริงบน prod วันนี้
    const goodText = keepWhole(found.text, word);
    const zwspText = found.text.split(word).join(ZWSP + word + ZWSP);
    const texts = { bad: found.text, good: goodText, zwsp: zwspText };
    for (const kind of ["bad", "good", "zwsp"]) {
      const el = document.createElement("div");
      el.className = "cap-phrase";
      el.id = `${kind}${n + 1}`;
      const inner = document.createElement("span");
      inner.className = "cap-word";
      inner.textContent = texts[kind];
      el.appendChild(inner);
      out.appendChild(el);
    }

    // ground truth ของชุด zwsp วัดเอง ไม่ได้สมมติ — บางใบสะอาดบางใบยังมีตำหนิ
    const zwspCut = anyLoanCut(zwspText, breakIndexes(probe, zwspText));
    report.push({
      n: n + 1, word, status: "ok", filler: found.filler, text: found.text,
      // ยืนยันด้วยตาได้ว่า bad ผ่ากลางคำจริงตรงไหน
      badSplit: found.text.slice(found.at, found.i) + " / " + found.text.slice(found.i, found.at + word.length),
      // ต้องเป็น null เสมอ ไม่งั้นเฟรม good ป้ายผิด แล้วผล FP ใช้ไม่ได้
      goodStillCut: anyLoanCut(goodText, breakIndexes(probe, goodText)),
      // ZWSP คร่อมคำแบบ GuardLoanWords กันได้จริงไหม = ground truth ของ zwsp_N.png
      zwspStillCut: zwspCut,
      zwspGroundTruth: zwspCut ? "มีตำหนิ" : "สะอาด",
    });
  });
  probe.remove();
  // fontOK: ถ้า Sarabun ไม่โหลด metric จะเพี้ยน = จุดตัดที่วัดได้ใช้ไม่ได้ทั้งชุด
  window.__fontOK = document.fonts.check('700 48px "Sarabun"');
  // allGood: ครบ 5 คู่ และไม่มีเฟรม good ใบไหนเหลือตำหนิ = ชุดเฟรมเชื่อถือได้
  window.__allGood = window.__fontOK
    && report.length === 5
    && report.every(r => r.status === "ok" && r.goodStillCut === null);
  window.__report = report;
  window.__ready = true;
});
</script>
